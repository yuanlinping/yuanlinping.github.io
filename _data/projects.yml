- title: RES of Greater Bay Area
  url: https://earthhk.hkust.edu.hk/home
  description: The project seeks to transform traditional RES modeling by creating an accurate, flexible, and user-friendly digital twin of the Guangdong-Hong Kong-Macao Bay Area. We are developing an immersive analytics system for seamless interaction, enabling users to extract valuable insights. 
