- title: AR Ricci Map
  image: 2023_ARRicciMap.png
  demo: https://library.hkust.edu.hk/china-in-maps/about-us
  description: AR Ricci Map is an AR mobile app that blendes digital maps with a physcial map. It shows different versions of ancient maps and transforms 2D maps into 3D globes, which provides exhibition visitors a new and engaging way to understand these historical maps. The app was an important part of the exibition China In Maps 500 Years of Evolving Images.
  highlight: 3

- title: Immersive Walk
  image: 2022_immersivewalk.png
  demo: https://hkustconnect-my.sharepoint.com/:v:/g/personal/lyuanaa_connect_ust_hk/EQOO18EgZ2ZFvrQ-ni7F6U0BjycEJReyRPT0lf05Zi96Qw?e=rZ2wY8
  description: Immersive Walk is an app that celebrates the HKUST 30th Anniversary by allowing students to go through the history of HKUST 30 years history in Augmented Reality. This is one step towards our goal of building AR/VR-enhanced HKUST campuses and enriching students’ and staff’s living experience. 

